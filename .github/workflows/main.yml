name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli @capacitor/core @capacitor/android

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/
          cp main.js www/

          if [ -f native-shim.js ]; then cp native-shim.js www/; fi
          if [ -f preload.js ]; then cp preload.js www/; fi
          if [ -f prompt.html ]; then cp prompt.html www/; fi
          if [ -f prompt-preload.js ]; then cp prompt-preload.js www/; fi

          cp icon*.png www/ 2>/dev/null || true

      - name: Prepare Android web files
        run: python3 prepare_web.py www node_modules --android

      - name: Verify Capacitor
        run: npx cap --version

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Check APK
        run: |
          echo "APK files:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
