name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Install Capacitor packages
        run: npm install --save-dev @capacitor/cli @capacitor/core @capacitor/android

      - name: Create web directory
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp main.js www/
          cp native-shim.js www/
          cp preload.js www/
          cp prompt.html www/
          cp prompt-preload.js www/
          cp icon*.png www/ 2>/dev/null || true

      - name: Prepare web files
        run: python3 prepare_web.py www node_modules --android

      - name: Verify Capacitor CLI
        run: npx cap --version

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
